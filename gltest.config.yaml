# GenLayer CLI / gltest configuration for SkyVerdict.
# See https://docs.genlayer.com for the current schema — this targets
# GenLayer Studio / TestnetBradbury as of the 2026 CLI.

network:
  # local Studio instance during development
  default: studionet
  studionet:
    rpc_url: "http://localhost:4000/api"
  testnet_bradbury:
    rpc_url: "https://bradbury.genlayer.com/api"

contracts:
  SkyVerdict:
    path: contracts/SkyVerdict.py
    deploy_args:
      - creator_address: "${CREATOR_ADDRESS}"

test:
  direct_dir: tests/direct
  integration_dir: tests/integration
  markers:
    integration: "requires a running GenLayer Studio instance"
